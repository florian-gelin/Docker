services:
  nginx:
    image: nginx:alpine
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - webdata:/usr/share/nginx/html

  ftp:
    image: fauria/vsftpd
    container_name: ftp
    depends_on:
      - nginx
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - FTP_USER=florian
      - FTP_PASS=florian
      - PASV_ADDRESS=192.168.200.156
      - PASV_MIN_PORT=21000
      - PASV_MAX_PORT=21010
      - LOCAL_UMASK=022
    volumes:
      - webdata:/home/vsftpd/florian

volumes:
  webdata:
